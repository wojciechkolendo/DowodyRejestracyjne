# Zobacz http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM daemona Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Wydajność builda.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX zamiast starej Support Library.
android.useAndroidX=true

# Styl kodu Kotlina: "official" albo "obsolete".
kotlin.code.style=official

# Tymczasowo: kapt (Data Binding -> BR) nie działa z wbudowanym Kotlinem w AGP 9.
android.builtInKotlin=false
android.newDsl=false
